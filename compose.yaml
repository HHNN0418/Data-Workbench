name: ctn
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ctn
      POSTGRES_USER: ctn
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ctn_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctn -d ctn"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  ctn_postgres:
secrets:
  postgres_password:
    file: ./data/runtime-secrets/postgres_password
